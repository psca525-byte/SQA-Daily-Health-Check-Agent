name: Daily System Health Check

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Check all systems and publish dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build the health check agent
        run: mvn -q clean package -DskipTests

      - name: Run health checks
        env:
          BLOODDONORS_USERNAME: ${{ secrets.BLOODDONORS_USERNAME }}
          BLOODDONORS_PASSWORD: ${{ secrets.BLOODDONORS_PASSWORD }}
          VCCS_USERNAME: ${{ secrets.VCCS_USERNAME }}
          VCCS_PASSWORD: ${{ secrets.VCCS_PASSWORD }}
        run: java -jar target/sqa-health-check-agent.jar
        continue-on-error: true

      - name: Upload dashboard as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-dashboard
          path: docs/index.html
          retention-days: 30

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
