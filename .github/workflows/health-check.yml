name: Daily System Health Check

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Check all systems and publish dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Configure network connectivity
        run: |
          echo "Checking network connectivity..."
          # Retry DNS resolution with increased timeout
          for i in {1..3}; do
            echo "Attempt $i: Checking DNS resolution..."
            if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/8.8.8.8/53'; then
              echo "✓ Network connectivity verified"
              break
            else
              echo "⚠ Network check attempt $i failed, retrying..."
              sleep 5
            fi
          done
          
          # Set network-related environment variables for better connectivity
          echo "Configuring network environment variables..."
          echo "JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true" >> $GITHUB_ENV
          echo "JAVA_TOOL_OPTIONS=-Dsun.net.spi.nameservice.provider.1=dns,sun" >> $GITHUB_ENV

      - name: Build the health check agent
        run: mvn -q clean package -DskipTests

      - name: Run health checks (with retry)
        env:
          BLOODDONORS_USERNAME: ${{ secrets.BLOODDONORS_USERNAME }}
          BLOODDONORS_PASSWORD: ${{ secrets.BLOODDONORS_PASSWORD }}
          VCCS_USERNAME: ${{ secrets.VCCS_USERNAME }}
          VCCS_PASSWORD: ${{ secrets.VCCS_PASSWORD }}
          MB_USERNAME: ${{ secrets.MB_USERNAME }}
          MB_PASSWORD: ${{ secrets.MB_PASSWORD }}
          PSP_USERNAME: ${{ secrets.PSP_USERNAME }}
          PSP_PASSWORD: ${{ secrets.PSP_PASSWORD }}
        run: |
          echo "Starting health checks with network error handling..."
          MAX_RETRIES=2
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Health check run $((RETRY_COUNT + 1))/$MAX_RETRIES"
            if java -jar target/sqa-health-check-agent.jar; then
              echo "✓ Health checks completed successfully"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠ Health check failed, waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done
          
          echo "⚠ Health checks failed after $MAX_RETRIES attempts, but continuing to generate dashboard..."
          exit 0
        continue-on-error: true

      - name: Upload dashboard as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-dashboard
          path: docs/index.html
          retention-days: 30

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
